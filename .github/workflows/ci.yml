name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI runs on GitHub-hosted runners and never touches a cluster.
# Action pins: see docs/versions.md.
jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - run: govulncheck ./...

  scrub:
    name: scrub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: bash hack/scrub.sh

  cross-compile:
    name: cross-compile (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build -trimpath -o /dev/null ./cmd/scry
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}

  reproducible:
    name: reproducible
    runs-on: ubuntu-latest
    steps:
      # Build the commit itself, not the pull request merge commit GitHub makes
      # for the run: a binary carries its commit, so only the same commit can
      # hash the same on another machine (the uploaded SHA256SUMS is for that).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Two clean builds, two directories
        run: |
          set -euo pipefail
          go version
          # A second clean checkout of the same commit in a different directory.
          git worktree add --detach "$RUNNER_TEMP/scry-second" HEAD
          bash hack/release.sh v0.0.0-ci
          (cd "$RUNNER_TEMP/scry-second" && bash hack/release.sh v0.0.0-ci)
          cp dist/SHA256SUMS "$RUNNER_TEMP/first.sums"
          diff -u "$RUNNER_TEMP/first.sums" "$RUNNER_TEMP/scry-second/dist/SHA256SUMS"
          echo "both builds hash identically:"
          cat dist/SHA256SUMS
      - name: The stamped binary reports its tag and commit
        run: |
          set -euo pipefail
          out="$(dist/scry_0.0.0-ci_linux_amd64 version)"
          echo "$out"
          [[ "$out" == "scry v0.0.0-ci ($(git rev-parse HEAD | cut -c1-12))" ]]
          dist/scry_0.0.0-ci_linux_amd64 version --json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS
          if-no-files-found: error
